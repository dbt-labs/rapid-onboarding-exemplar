models:
  - name: dim_customers
    description: this model consolidates customer information by joining customer data with nation and region details, providing a comprehensive view of customer demographics and financials.
    columns:
      - name: customer_id
        description: a unique identifier for each customer.
        tests:
          - unique
          - not_null
      - name: name
        description: the name of the customer.
        tests:
          - not_null
      - name: address
        description: the address of the customer.
        tests:
          - not_null
      - name: nation
        description: the nation where the customer resides.
        tests:
          - not_null
      - name: region
        description: the region associated with the customer's nation.
        tests:
          - not_null
      - name: phone_number
        description: the contact phone number of the customer.
        tests:
          - not_null
      - name: account_balance
        description: the current account balance of the customer.
        tests:
          - not_null
      - name: market_segment
        description: the market segment to which the customer belongs.
        tests:
          - not_null